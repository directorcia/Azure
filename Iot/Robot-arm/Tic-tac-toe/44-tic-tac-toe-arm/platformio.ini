[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps =
	arduino-libraries/Servo@^1.2.2
	arduino-libraries/ArduinoHttpClient@^0.6.1
	bblanchon/ArduinoJson@^7.1.0
build_src_filter = -<*> +<main.cpp>

[env:cell_sequence]
extends = env:uno_r4_wifi
build_src_filter = -<*> +<cell_sequence.cpp>

[env:mapping]
extends = env:uno_r4_wifi
build_src_filter = -<*> +<mapping.cpp>

[env:gemini]
extends = env:uno_r4_wifi
build_src_filter = -<*> +<gemini_test.cpp>
lib_deps =
	arduino-libraries/ArduinoHttpClient@^0.6.1
	bblanchon/ArduinoJson@^7.1.0

[env:tictactoe]
extends = env:gemini
build_src_filter = -<*> +<tic_tac_toe.cpp>
lib_deps =
	${env:gemini.lib_deps}
	arduino-libraries/Servo@^1.2.2
