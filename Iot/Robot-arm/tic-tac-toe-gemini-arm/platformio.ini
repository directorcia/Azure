; Tic-tac-toe robot arm. Arduino UNO R4 WiFi, Arduino framework.
; Secrets are local headers; see include/*.example.h and README.md.
;
;   pio run -e uno_r4_wifi
;   pio run -e uno_r4_wifi -t upload
;   pio device monitor -b 115200

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps =
    ; Servo is not in the UNO R4 core. 1.2.1+ has the Renesas backend the
    ; sketch's attach / writeMicroseconds calls expect.
    arduino-libraries/Servo@^1.2.1
    bblanchon/ArduinoJson@^7.4.2
    arduino-libraries/ArduinoHttpClient@^0.6.1
